name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend and Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if mediapulse-core changed without a version bump
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent commit to compare against; skipping."
            exit 0
          fi
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Parent commit $before not available; skipping."
            exit 0
          fi
          if git diff --quiet "$before" HEAD -- crates/mediapulse-core/src crates/mediapulse-core/Cargo.toml; then
            echo "mediapulse-core unchanged; nothing to guard."
            exit 0
          fi
          if git diff --quiet "$before" HEAD -- Cargo.toml; then
            echo "::error::mediapulse-core changed but the workspace version in Cargo.toml did not."
            echo "Consumers resolve mediapulse-core from crates.io by version, so a source"
            echo "change without a version bump is never published and ships stale code."
            echo "Bump [workspace.package] version and publish mediapulse-core first."
            exit 1
          fi
          echo "mediapulse-core changed and the workspace version was bumped. Good."

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Tauri and mpv build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            mpv

      - name: Stage Linux mpv sidecar for Tauri validation
        run: |
          mkdir -p src-tauri/binaries
          cp /usr/bin/mpv src-tauri/binaries/mpv-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/mpv-x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend checks
        run: bun run check

      - name: Build frontend into Tauri dist
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run strict Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Verify declared Rust 1.85 compatibility
        run: cargo +1.85.0 check --workspace --all-features

      - name: Package and verify mediapulse-core
        run: cargo package -p mediapulse-core --offline

      - name: Assemble app crate with local core patch
        run: cargo package -p mediapulse --no-verify --config 'patch.crates-io.mediapulse-core.path="crates/mediapulse-core"'

      - name: Validate Tauri release compilation and sidecar resolution
        run: bunx tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
